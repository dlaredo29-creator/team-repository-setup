<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hand Proximity Demo</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
    #piece { position: fixed; inset: 0; z-index: 0; width: 100vw; height: 100vh; }
    #camera { position: fixed; right: 12px; bottom: 12px; width: min(28vw, 280px); aspect-ratio: 4 / 3;
              z-index: 1; object-fit: cover; transform: scaleX(-1); border-radius: 4px; opacity: 0;
              border: 1px solid rgba(242, 239, 233, 0.55); pointer-events: none; }
    #camera.shown { opacity: 1; }
    #start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
             font: 16px/1.2 system-ui, sans-serif; padding: 12px 20px; border-radius: 6px;
             z-index: 2; border: 1px solid #f2efe9; background: rgba(21, 27, 27, 0.94);
             color: #f2efe9; cursor: pointer; }
    #start:disabled { opacity: 0.6; cursor: wait; }
    pre { position: fixed; z-index: 3; margin: 0; padding: 10px 12px; font: 12px/1.45 ui-monospace, Menlo, monospace;
          color: #f2efe9; background: rgba(0, 0, 0, 0.7); border-radius: 4px; white-space: pre; }
    #readout { left: 12px; top: 12px; }
    #scores { right: 12px; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  </style>
</head>
<body>
  <canvas id="piece"></canvas>
  <video id="camera" playsinline muted></video>
  <button id="start">Start hand demo</button>
  <pre id="readout" hidden></pre>
  <pre id="scores" hidden></pre>

  <script src="table.js"></script>
  <script src="fake-sense.js"></script>
  <script src="piece.js"></script>
  <script type="module" src="sense.js"></script>
</body>
</html>
